Description: 'Microsoft PowerToys is a set of utilities for power users to tune and
  streamline their Windows experience for greater productivity.

  Inspired by the Windows 95 era PowerToys project, this reboot provides power users
  with ways to squeeze more efficiency out of the Windows 10 shell and customize it
  for individual workflows.'
