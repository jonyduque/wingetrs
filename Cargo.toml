[package]
name = "wingetrs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Gerenciador de pacotes rápido sobre os catálogos do winget e do scoop"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wingetrs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
fancy-regex = "0.19.2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
futures-util = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "ico", "jpeg", "gif"] }
md-5 = "0.11.0"
nucleo = "0.5.0"
ratatui = "0.30.2"
ratatui-image = { version = "=11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream"] }
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
unicode-normalization = "0.1.25"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Management_Deployment", "ApplicationModel", "Foundation_Collections", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell_Common", "Win32_System_Com_StructuredStorage"] }
junction = "2.1.0"
winreg = "0.56.0"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Normalization regexes dominate `list` time in debug builds.
[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
